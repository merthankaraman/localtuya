reload:
  description: Reload localtuya and reconnect to all devices.

set_dp:
  description: Change the value of a datapoint (DP)
  fields:
    device_id:
      description: Device ID of device to change datapoint value for
      example: 11100118278aab4de001
    dp:
      description: Datapoint index
      example: 1
    value:
      description: New value to set
      example: False

reset_energy:
  description: Reset accumulated local energy (add_ele sensor) to zero
  fields:
    entity_id:
      description: Energy sensor entity_id to reset
      example: sensor.merthan_oda_ana_priz_enerji

set_energy:
  description: Set accumulated local energy (add_ele sensor) to a starting kWh value
  fields:
    entity_id:
      description: Energy sensor entity_id to update
      example: sensor.merthan_oda_ana_priz_enerji
    value:
      description: Energy total in kWh
      example: 12.5
